<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff9ef" />
  <title>Tic Tac Toe ♡ Two Players</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --cream: #fff9ef;
      --cream-deep: #fff3e3;
      --pink: #f3b4d0;
      --pink-light: #ffe1ed;
      --purple: #d6c4ef;
      --purple-light: #eee3fb;
      --text: #7c6f91;
      --white: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: grid; place-items: center;
      font-family: 'Quicksand', sans-serif; font-weight: 600;
      background: radial-gradient(circle at 12% 16%, #ffe5ee 0, transparent 27%),
                  radial-gradient(circle at 87% 81%, #e9ddfa 0, transparent 29%),
                  var(--cream);
      color: var(--text);
    }
    main {
      width: min(100%, 430px); text-align: center;
      background: rgba(255,253,249,.91); border: 2px solid #f7deeb;
      border-radius: 32px; padding: 28px 22px 24px;
      box-shadow: 0 18px 50px rgba(164,132,172,.12), 0 5px 12px rgba(164,132,172,.06);
    }
    .decor { color: #dda2c4; letter-spacing: .6em; font-size: 1rem; margin-bottom: 8px; }
    h1 { font-family: 'Fredoka', sans-serif; font-size: clamp(2rem, 8vw, 2.85rem); font-weight: 600; color: #d995b9; letter-spacing: .035em; margin: 2px 0 10px; }
    #identity { color: var(--text); background: var(--purple-light); border-radius: 100px; padding: 8px 16px; display: inline-block; font-size: .9rem; }
    #status { font-family: 'Fredoka', sans-serif; color: var(--text); font-size: 1.22rem; min-height: 2.8rem; margin: 20px 0 5px; }
    #board {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 12px;
      width: min(100%, 342px); margin: 12px auto 24px;
      background: #fff0f6; border: 2px solid #f5d8e7;
      border-radius: 28px; padding: 14px;
      box-shadow: 0 7px 18px rgba(211,169,194,.12);
    }
    .cell {
      aspect-ratio: 1; min-width: 0; border: 2px solid #f7e3eb;
      border-radius: 19px; background: var(--white);
      font-family: 'Fredoka', sans-serif; font-size: clamp(2.3rem, 11vw, 4rem);
      font-weight: 600; color: var(--text); cursor: pointer;
      box-shadow: 0 4px 8px rgba(206,174,191,.12);
      transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease;
    }
    .cell:not(:disabled):hover { background: #fff6fb; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(206,174,191,.2); }
    .cell:disabled { cursor: default; opacity: 1; }
    .cell.x { color: #e6a0c2; }
    .cell.o { color: #b39adf; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    button.action {
      font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: .98rem;
      border: 0; border-radius: 999px; padding: 12px 17px;
      background: var(--pink-light); color: var(--text);
      cursor: pointer; transition: transform .15s ease, filter .15s ease;
      box-shadow: 0 3px 8px rgba(206,174,191,.12);
    }
    button.action:hover:not(:disabled) { transform: translateY(-2px); filter: saturate(1.15); }
    button.action:disabled { opacity: .48; cursor: default; }
    #rematch { background: var(--purple-light); }
    #new { background: var(--purple); }
    #room { overflow-wrap: anywhere; font-size: .77rem; margin-top: 22px; opacity: .8; }
    #error { color: #bd5e7e; overflow-wrap: anywhere; font-size: .83rem; }
    .footer { color: #baa8c2; font-size: .79rem; margin: 18px 0 0; }
    @media (max-width: 360px) { main { padding: 22px 12px; } #board { gap: 8px; padding: 10px; } .actions { gap: 7px; } button.action { padding: 10px 13px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="decor" aria-hidden="true">✿ ♡ ✿</div>
    <h1>tic tac toe ♡</h1>
    <div id="identity">Connecting...</div>
    <div id="status" aria-live="polite">Loading game...</div>
    <div id="board" aria-label="Tic-tac-toe board"></div>
    <div class="actions">
      <button class="action" id="copy" type="button">♡ Copy invite link</button>
      <button class="action" id="rematch" type="button" disabled>Play again</button>
      <button class="action" id="new" type="button">New room</button>
    </div>
    <div id="room"></div>
    <p id="error" role="alert"></p>
    <p class="footer">good luck dont lose♡</p>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
    import { getDatabase, ref, onValue, runTransaction } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDSXa0RmVMmJ3-9BXn-wBMukcoKKEcVeW0",
      authDomain: "tic-tac-toe-3e93f.firebaseapp.com",
      databaseURL: "https://tic-tac-toe-3e93f-default-rtdb.firebaseio.com",
      projectId: "tic-tac-toe-3e93f",
      appId: "1:315998840470:web:7f9627c96829eebbadc4b7"
    };

    const $ = id => document.getElementById(id);
    const boardEl = $('board');
    const cells = [];
    let uid = null;
    let roomId = null;
    let gameRef = null;
    let game = null;
    let role = null;
    let busy = false;
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    function outcome(board) {
      for (const [a,b,c] of wins) {
        if (board[a] !== '.' && board[a] === board[b] && board[a] === board[c]) return board[a];
      }
      return board.includes('.') ? '' : 'Draw';
    }
    function showError(err) { $('error').textContent = err?.message || String(err); }
    function render() {
      role = game?.x === uid ? 'X' : game?.o === uid ? 'O' : null;
      $('identity').textContent = role ? `You are Player ${role}` : 'Room full: spectator';
      if (!game) {
        $('status').textContent = 'Loading...';
      } else if (game.winner) {
        $('status').textContent = game.winner === 'Draw'
          ? 'Draw!' : (game.winner === role ? 'You won!' : `Player ${game.winner} wins!`);
      } else if (!game.o) {
        $('status').textContent = 'Waiting for your friend to join...';
      } else {
        $('status').textContent = game.turn === role ? 'Your turn!' : `Player ${game.turn}'s turn`;
      }
      const board = game?.board || '.........';
      cells.forEach((cell, i) => {
        cell.textContent = board[i] === '.' ? '' : board[i];
        cell.className = 'cell ' + (board[i] === '.' ? '' : board[i].toLowerCase());
        cell.disabled = busy || !game || !game.o || !!game.winner || game.turn !== role || board[i] !== '.';
      });
      $('rematch').disabled = busy || !game?.winner || !role;
    }
    for (let i = 0; i < 9; i++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cell'; b.setAttribute('aria-label', `Square ${i+1}`);
      b.addEventListener('click', () => makeMove(i));
      boardEl.appendChild(b);
      cells.push(b);
    }
    async function makeMove(i) {
      if (busy || !role || !game || game.winner || game.turn !== role || !game.o || game.board[i] !== '.') return;
      busy = true; render();
      try {
        await runTransaction(gameRef, current => {
          if (!current || current.winner || !current.o || current.turn !== role ||
              current[role.toLowerCase()] !== uid || current.board[i] !== '.') return;
          const board = current.board.substring(0, i) + role + current.board.substring(i+1);
          return {...current, board, winner: outcome(board), turn: role === 'X' ? 'O' : 'X'};
        }, {applyLocally: false});
      } catch (err) { showError(err); }
      finally { busy = false; render(); }
    }
    async function joinRoom() {
      const url = new URL(window.location.href);
      let requested = url.searchParams.get('room');
      if (!requested || !/^[a-z0-9-]{8,80}$/i.test(requested)) {
        requested = crypto.randomUUID();
        url.searchParams.set('room', requested);
        history.replaceState(null, '', url);
      }
      roomId = requested;
      gameRef = ref(getDatabase(app), 'rooms/' + roomId);
      $('room').textContent = 'Room: ' + roomId;
      await runTransaction(gameRef, current => {
        if (!current) return { board: '.........', x: uid, o: '', turn: 'X', winner: '', round: 1 };
        if (current.x === uid || current.o === uid) return;
        if (!current.o) return {...current, o: uid};
        return;
      }, {applyLocally: false});
      onValue(gameRef, snapshot => { game = snapshot.val(); render(); }, showError);
    }
    $('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); $('copy').textContent = 'Copied! ♡'; }
      catch { window.prompt('Copy this invite link:', location.href); }
    });
    $('new').addEventListener('click', () => {
      const url = new URL(location.href);
      url.searchParams.delete('room');
      location.href = url.toString();
    });
    $('rematch').addEventListener('click', async () => {
      if (busy || !game?.winner || !role) return;
      busy = true; render();
      try {
        await runTransaction(gameRef, current => {
          if (!current?.winner || (current.x !== uid && current.o !== uid)) return;
          return {...current, board: '.........', turn: 'X', winner: '', round: (current.round || 1) + 1};
        }, {applyLocally: false});
      } catch (err) { showError(err); }
      finally { busy = false; render(); }
    });
    let app;
    try {
      app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      await signInAnonymously(auth);
      uid = auth.currentUser.uid;
      await joinRoom();
    } catch (err) {
      $('status').textContent = 'Could not connect to Firebase.';
      showError(err);
    }
  </script>
</body>
</html>
