<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic Tac Toe | Two Players</title>
 <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(180deg, #fff7fb 0%, #f9f0ff 45%, #eef7ff 100%);
    color: #fffafc;
    text-align: center;
    padding: 30px 15px;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 3rem;
    margin-bottom: 10px;
    color: #ff8fb1;
    letter-spacing: 1px;
  }

  #status, #player, #link {
    font-size: 1.1rem;
    margin: 10px 0;
    color: #7c6f91;
  }

  #link {
    max-width: 700px;
    margin: 15px auto;
    word-break: break-word;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    gap: 14px;
    justify-content: center;
    margin: 30px auto;
    padding: 18px;
    background: rgba(255,255,255,0.65);
    border: 2px solid #f6d8e6;
    border-radius: 28px;
    width: fit-content;
    box-shadow: 0 8px 24px rgba(215, 188, 220, 0.25);
    backdrop-filter: blur(6px);
  }

  .cell {
    width: 110px;
    height: 110px;
    border: none;
    border-radius: 24px;
    background: #fffafc;
    box-shadow: 0 4px 10px rgba(212, 183, 201, 0.25);
    font-family: 'Fredoka', sans-serif;
    font-size: 3rem;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .cell:hover:enabled {
    transform: translateY(-2px);
    background: #fff1f7;
    box-shadow: 0 8px 16px rgba(212, 183, 201, 0.35);
  }

  .cell:disabled {
    cursor: default;
    opacity: 1;
  }

  .cell.x {
    color: #ff8fb1;
  }

  .cell.o {
    color: #8ebfff;
  }

  button {
    font-family: 'Fredoka', sans-serif;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    margin: 8px;
    cursor: pointer;
    background: #ffd6e7;
    color: #7b5f74;
    box-shadow: 0 4px 10px rgba(212, 183, 201, 0.25);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  button:hover {
    transform: translateY(-1px);
    background: #ffc9df;
  }

  #copy {
    background: #ffd9ec;
  }

  #rematch {
    display: none;
    background: #dff2ff;
    color: #62758e;
  }

  #newRoom {
    background: #e8dcff;
    color: #6f6490;
  }

  .card {
    background: rgba(255,255,255,0.65);
    border-radius: 24px;
    padding: 18px;
    max-width: 760px;
    margin: 0 auto 20px auto;
    border: 2px solid #f5deea;
    box-shadow: 0 8px 24px rgba(215, 188, 220, 0.18);
  }
</style>
</head>
<body>
  <main>
    <h1>tic tac toe</h1>
    <div id="identity">Connecting...</div>
    <div id="status">Loading game...</div>
    <div id="board" aria-label="Tic-tac-toe board"></div>
    <button class="action" id="copy" type="button">Copy invite link</button>
    <button class="action" id="rematch" type="button" disabled>Play again</button>
    <button class="action" id="new" type="button">New room</button>
    <div id="room"></div>
    <p id="error" role="alert"></p>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
    import { getDatabase, ref, onValue, runTransaction } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';

    // REPLACE with the config provided by Firebase > Project settings > Your apps.
    // Include the databaseURL copied from Firebase > Realtime Database.
    
const firebaseConfig = {
  apiKey: "AIzaSyDSXa0RmVMmJ3-9BXn-wBMukcoKKEcVeW0",
  authDomain: "tic-tac-toe-3e93f.firebaseapp.com",
  databaseURL: "https://tic-tac-toe-3e93f-default-rtdb.firebaseio.com",
  projectId: "tic-tac-toe-3e93f",
  appId: "1:315998840470:web:7f9627c96829eebbadc4b7"
};


    const $ = id => document.getElementById(id);
    const boardEl = $('board');
    const cells = [];
    let uid = null;
    let roomId = null;
    let gameRef = null;
    let game = null;
    let role = null;
    let busy = false;

    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function outcome(board) {
      for (const [a,b,c] of wins) {
        if (board[a] !== '.' && board[a] === board[b] && board[a] === board[c]) return board[a];
      }
      return board.includes('.') ? '' : 'Draw';
    }
    function showError(err) {
      $('error').textContent = err?.message || String(err);
    }
    function render() {
      role = game?.x === uid ? 'X' : game?.o === uid ? 'O' : null;
      $('identity').textContent = role ? `You are Player ${role}` : 'Room full: spectator';
      if (!game) {
        $('status').textContent = 'Loading...';
      } else if (game.winner) {
        $('status').textContent = game.winner === 'Draw'
          ? 'Draw!' : (game.winner === role ? 'You won!' : `Player ${game.winner} wins!`);
      } else if (!game.o) {
        $('status').textContent = 'Waiting for your friend to join...';
      } else {
        $('status').textContent = game.turn === role ? 'Your turn!' : `Player ${game.turn}'s turn`;
      }
      const board = game?.board || '.........';
      cells.forEach((cell, i) => {
        cell.textContent = board[i] === '.' ? '' : board[i];
        cell.className = 'cell ' + (board[i] === '.' ? '' : board[i].toLowerCase());
        cell.disabled = busy || !game || !game.o || !!game.winner || game.turn !== role || board[i] !== '.';
      });
      $('rematch').disabled = busy || !game?.winner || !role;
    }
    for (let i = 0; i < 9; i++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cell'; b.setAttribute('aria-label', `Square ${i+1}`);
      b.addEventListener('click', () => makeMove(i));
      boardEl.appendChild(b);
      cells.push(b);
    }
    async function makeMove(i) {
      if (busy || !role || !game || game.winner || game.turn !== role || !game.o || game.board[i] !== '.') return;
      busy = true; render();
      try {
        await runTransaction(gameRef, current => {
          if (!current || current.winner || !current.o || current.turn !== role ||
              current[role.toLowerCase()] !== uid || current.board[i] !== '.') return;
          const board = current.board.substring(0, i) + role + current.board.substring(i+1);
          return {...current, board, winner: outcome(board), turn: role === 'X' ? 'O' : 'X'};
        }, {applyLocally: false});
      } catch (err) { showError(err); }
      finally { busy = false; render(); }
    }
    async function joinRoom() {
      const url = new URL(window.location.href);
      let requested = url.searchParams.get('room');
      if (!requested || !/^[a-z0-9-]{8,80}$/i.test(requested)) {
        requested = crypto.randomUUID();
        url.searchParams.set('room', requested);
        history.replaceState(null, '', url);
      }
      roomId = requested;
      gameRef = ref(getDatabase(app), 'rooms/' + roomId);
      $('room').textContent = 'Room: ' + roomId;
      const result = await runTransaction(gameRef, current => {
        if (!current) return { board: '.........', x: uid, o: '', turn: 'X', winner: '', round: 1 };
        if (current.x === uid || current.o === uid) return; // already joined
        if (!current.o) return {...current, o: uid};
        return; // spectator; room full
      }, {applyLocally: false});
      // Everyone, including spectators and returning players, receives updates.
      onValue(gameRef, snapshot => { game = snapshot.val(); render(); }, showError);
    }
    $('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); $('copy').textContent = 'Copied!'; }
      catch { window.prompt('Copy this invite link:', location.href); }
    });
    $('new').addEventListener('click', () => {
      const url = new URL(location.href);
      url.searchParams.delete('room');
      location.href = url.toString();
    });
    $('rematch').addEventListener('click', async () => {
      if (busy || !game?.winner || !role) return;
      busy = true; render();
      try {
        await runTransaction(gameRef, current => {
          if (!current?.winner || (current.x !== uid && current.o !== uid)) return;
          return {...current, board: '.........', turn: 'X', winner: '', round: (current.round || 1) + 1};
        }, {applyLocally: false});
      } catch (err) { showError(err); }
      finally { busy = false; render(); }
    });

    let app;
    try {
      app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      await signInAnonymously(auth);
      uid = auth.currentUser.uid;
      await joinRoom();
    } catch (err) {
      $('status').textContent = 'Could not connect to Firebase.';
      showError(err);
    }
  </script>
</body>
</html>
